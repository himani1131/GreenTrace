<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenTrace</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060f0c;--em:#34d399;--mint:#b8f3d0;--g:#1f8a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:Manrope,Inter,system-ui,sans-serif;color:#eafff4}
body{background:radial-gradient(ellipse at 50% 45%,#0f2a22 0%,#0a1c16 40%,#050c09 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.wrap{position:fixed;left:0;right:0;bottom:0;height:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 14px);gap:10px}
.rv{opacity:0;transform:translateY(14px);filter:blur(6px);animation:rv .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.42em;font-size:clamp(14px,2.2vw,20px);color:var(--mint);animation-delay:3.0s}
.logo svg{width:26px;height:26px}
h1{font-weight:800;font-size:clamp(28px,5.4vw,60px);letter-spacing:-.02em;line-height:1.05;animation-delay:3.4s;background:linear-gradient(90deg,#eafff4,#7be8b4,#eafff4);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{font-weight:300;font-size:clamp(13px,1.9vw,18px);color:#a8d9c1;max-width:560px;animation-delay:3.8s}
.btn{animation-delay:4.2s;margin-top:6px;display:inline-block;text-decoration:none;color:#042417;background:linear-gradient(135deg,#b8f3d0,#34d399);font-weight:700;padding:14px 34px;border-radius:999px;font-size:15px;letter-spacing:.04em;transition:box-shadow .3s,transform .3s}
.btn:hover,.btn:focus-visible{box-shadow:0 0 0 1px #b8f3d0,0 0 34px 6px rgba(52,211,153,.55);transform:translateY(-2px);outline:none}
.steps{animation-delay:4.6s;font-size:11px;letter-spacing:.32em;color:#6fb596;font-weight:500;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps span{animation:pl 4s infinite}.steps span:nth-child(3){animation-delay:1s}.steps span:nth-child(5){animation-delay:2s}.steps span:nth-child(7){animation-delay:3s}
@keyframes pl{0%,70%,100%{color:#6fb596}85%{color:#eafff4;text-shadow:0 0 12px #34d399}}
.skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:none;border:1px solid rgba(184,243,208,.25);color:#a8d9c1;font:500 12px Manrope,sans-serif;letter-spacing:.12em;padding:7px 14px;border-radius:999px;cursor:pointer;opacity:.7}
.skip:hover{opacity:1}
.skipped .rv{animation-duration:.01s;animation-delay:0s}
@media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none;filter:none}.steps span{animation:none}.skip{display:none}.btn{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="vig"></div>
<button class="skip" id="skip">SKIP INTRO</button>
<main class="wrap">
  <div class="logo rv"><svg viewBox="0 0 32 32" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"><path d="M16 28V12M16 20c-6 0-9-4-9-9 6 0 9 3 9 9zM16 16c0-5 3-9 9-9 0 5-3 9-9 9z"/><circle cx="16" cy="28" r="1.6" fill="#34d399"/></svg>GREENTRACE</div>
  <h1 class="rv">Code Smarter. Think Greener.</h1>
  <p class="sub rv">Intelligent Code Optimization for a Sustainable Digital Future.</p>
  <a class="btn rv" id="go" href="index.html">Explore GreenTrace</a>
  <div class="steps rv" aria-label="Analyze, Optimize, Validate, Measure"><span>ANALYZE</span><span>·</span><span>OPTIMIZE</span><span>·</span><span>VALIDATE</span><span>·</span><span>MEASURE</span></div>
</main>
<script>
// >>> Set this to your app's entry / login page <<<
const ENTRY_URL = "index.html#login";
document.getElementById("go").href = ENTRY_URL;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, dpr, cx, by, sc, mobile;
var segsT = [], segsR = [], P = [], paths = [], ambient = [], pulses = [];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = v => v * v * (3 - 2 * v);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// glow sprite
const sp = document.createElement("canvas"); sp.width = sp.height = 64;
{ const g = sp.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(220,255,235,1)"); r.addColorStop(.25, "rgba(52,211,153,.7)"); r.addColorStop(1, "rgba(52,211,153,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); }

var canopy = [];
const bl = document.createElement("canvas"); bl.width = bl.height = 64;
{ const g = bl.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(10,48,30,.55)"); r.addColorStop(1, "rgba(10,48,30,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); }
const LEAF = ["#1f5a36", "#2f7544", "#47925a", "#6ab06d"];   // deep -> sunlit greens
const MAXD = 5, MAXLV = (MAXD + 1) * 3;

function build() {
  seed = 11; segsT = []; segsR = []; P = []; paths = []; pulses = []; canopy = [];
  const X = u => cx + u * sc, Y = u => by + u * sc, clusters = [];
  // natural limb: 3 gently bending sub-segments, tapering, pulled slightly toward the light
  function limb(x, y, a, len, w, d, path) {
    let px = x, py = y, pa = a; const p = path.slice();
    for (let i = 0; i < 3; i++) {
      pa += (rnd() - .5) * .24 + (-Math.PI / 2 - pa) * .06;
      const nx = px + Math.cos(pa) * len / 3, ny = py + Math.sin(pa) * len / 3;
      segsT.push([px, py, nx, ny, w * (1 - .09 * i), (MAXD - d) * 3 + i]);
      px = nx; py = ny; p.push([px, py]);
    }
    if (d <= 1) clusters.push([px, py, d ? .06 : .078, d]);
    if (d === 0) { paths.push(p.map(q => [X(q[0]), Y(q[1])])); return; }
    const n = d === MAXD ? 3 : 2, cw = w * .66;
    for (let i = 0; i < n; i++) {
      const side = n === 3 ? i - 1 : (i ? 1 : -1), spread = (d >= 4 ? .5 : .62) + rnd() * .28;
      limb(px, py, pa + side * spread + (rnd() - .5) * .2, len * (.7 + rnd() * .1), cw, d - 1, p);
    }
  }
  for (let k = -3; k <= 3; k++) if (k) segsT.push([0, 0, k * .032, .022 + Math.abs(k) * .006, .02 - Math.abs(k) * .004, 0]); // root flare
  limb(0, 0, -Math.PI / 2, .26, .046, MAXD, [[0, 0]]);
  // circuit-board roots (unchanged concept)
  for (let i = 0; i < 16; i++) {
    const dir = i % 2 ? 1 : -1; let x = (rnd() - .5) * .05, y = 0; const pts = [[x, y]], n = 4 + (rnd() * 3 | 0);
    for (let s = 0; s < n; s++) {
      const m = s % 3, k = .04 + rnd() * .06;
      if (m === 0) y += k; else if (m === 1) { x += dir * k; y += k; } else x += dir * k * 1.4;
      if (y > .3) break; pts.push([x, y]); segsR.push([pts[pts.length - 2][0], pts[pts.length - 2][1], x, y, 0]);
    }
    paths.push(pts.map(q => [X(q[0]), Y(q[1])]).reverse());
  }
  // targets: a few faint code-dots along the wood + leaves clustered at limb ends
  const bud = mobile ? 200 : 340; let L = 0; segsT.concat(segsR).forEach(s => L += Math.hypot(s[2] - s[0], s[3] - s[1]));
  const step = L / bud, rows = Math.floor(H / 16), G = "01{}();=<>/+";
  const mk = (tx, ty, leaf, d) => { const y = (1 + (rnd() * (rows - 2) | 0)) * 16, x = rnd() * W;
    P.push({ x, y, sx: x, sy: y, tx, ty, leaf, v: 40 + rnd() * 110, d, ch: G.charAt(rnd() * 12 | 0), ph: rnd() * 6.28, ex: false, m: 0, ang: rnd() * 3.14, size: sc * (.017 + rnd() * .013), ci: 0 }); };
  segsT.concat(segsR).forEach(s => { const l = Math.hypot(s[2] - s[0], s[3] - s[1]), n = Math.max(1, Math.round(l / step));
    for (let i = 0; i < n; i++) { const f = i / n; mk(X(s[0] + (s[2] - s[0]) * f), Y(s[1] + (s[3] - s[1]) * f), 0, rnd() * .5); } });
  const lv0 = P.length;
  clusters.forEach(c => { canopy.push([X(c[0]), Y(c[1]), c[2] * sc]); const n = c[3] ? (mobile ? 3 : 4) : (mobile ? 6 : 9);
    for (let i = 0; i < n; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * c[2]; mk(X(c[0] + Math.cos(a) * r * 1.25), Y(c[1] + Math.sin(a) * r * .85), 1, .45 + rnd() * .55); } });
  let top = 1e9, bot = -1e9; for (let i = lv0; i < P.length; i++) { top = Math.min(top, P[i].ty); bot = Math.max(bot, P[i].ty); }
  for (let i = lv0; i < P.length; i++) { const q = P[i], lit = 1 - (q.ty - top) / Math.max(1, bot - top); q.ci = Math.max(0, Math.min(3, Math.floor(lit * 3.2 + (rnd() - .5) * 1.3))); }
  for (let i = 0; i < (mobile ? 80 : 160); i++) { const y = (1 + (rnd() * (rows - 2) | 0)) * 16, x = rnd() * W;
    P.push({ x, y, sx: x, sy: y, tx: x, ty: y, leaf: 0, v: 40 + rnd() * 110, d: 0, ch: G.charAt(rnd() * 12 | 0), ph: 0, ex: true, m: 0 }); }
  ambient = Array.from({ length: mobile ? 35 : 70 }, () => ({ x: rnd() * W, y: rnd() * H, r: 1 + rnd() * 2.5, v: 4 + rnd() * 12, a: .2 + rnd() * .5, ph: rnd() * 6 }));
  for (let i = 0; i < 6; i++) pulses.push({ p: paths[(rnd() * paths.length) | 0], s: -rnd() * 300, v: 110 + rnd() * 80 });
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; mobile = W < 700;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; by = H * (mobile ? .46 : .5); sc = Math.min(H * (mobile ? .3 : .36), W * .5); build();
}
addEventListener("resize", resize); resize();

function plen(p) { let l = 0; for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return l; }
function at(p, s) { for (let i = 1; i < p.length; i++) { const l = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (s <= l) { const f = s / l; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * f, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f]; } s -= l; } return p[p.length - 1]; }
function glow(x, y, r, a) { ctx.globalAlpha = a; ctx.drawImage(sp, x - r, y - r, r * 2, r * 2); }

let t0 = performance.now(), last = t0, skipT = 0;
document.getElementById("skip").onclick = () => { skipT = 6; document.body.classList.add("skipped"); };

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = reduce ? 30 : (now - t0) / 1000 + skipT;
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  const raw = clamp((t - 1.7) / 1.9), rev = ease(raw), lf = ease(clamp((t - 2) / 1.6));
  const gr = ctx.createRadialGradient(cx, by + sc * .1, 0, cx, by + sc * .1, sc * .9);
  gr.addColorStop(0, `rgba(52,211,153,${.16 * ease(clamp((t - 1.5) / 2))})`); gr.addColorStop(1, "rgba(52,211,153,0)");
  ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ambient.forEach(a => { if (!reduce) { a.y -= a.v * dt; a.x += Math.sin(t + a.ph) * 6 * dt; if (a.y < -10) a.y = H + 10; } glow(a.x, a.y, a.r * 3, a.a * clamp(t / 1) * .5); });
  // circuit roots (thin lines, as before)
  ctx.beginPath(); const X = u => cx + u * sc, Y = u => by + u * sc;
  segsR.forEach(s => { ctx.moveTo(X(s[0]), Y(s[1])); ctx.lineTo(X(s[2]), Y(s[3])); });
  ctx.lineCap = "round"; ctx.globalAlpha = rev * .3; ctx.strokeStyle = "rgba(52,211,153,.9)"; ctx.lineWidth = mobile ? 3 : 5; ctx.stroke();
  ctx.globalAlpha = rev * .85; ctx.strokeStyle = "rgba(120,240,180,.95)"; ctx.lineWidth = 1; ctx.stroke();
  // code glyphs converge (leaf glyphs become leaves, wood glyphs become dots that fade)
  ctx.font = "11px 'Courier New',monospace"; ctx.textAlign = "center";
  const si = clamp((t - .3) / 1);
  for (const q of P) {
    const m = q.ex ? 0 : ease(clamp((t - 1 - q.d * 1.2) / 1.4)); q.m = m;
    if (m <= 0) { if (!reduce) { q.x += q.v * dt; if (q.x > W + 20) q.x = -20; } q.sx = q.x; q.sy = q.y; }
    let x = q.x, y = q.y;
    if (m > 0) { x = q.sx + (q.tx - q.sx) * m; y = q.sy + (q.ty - q.sy) * m + Math.sin(t * 3 + q.ph) * (1 - m) * 10; }
    q.px = x; q.py = y;
    if (q.ex) { const f = 1 - ease(clamp((t - 2) / 2)); if (f <= 0) continue; ctx.globalAlpha = .45 * si * f; ctx.fillStyle = "#34d399"; ctx.fillText(q.ch, x, y); continue; }
    if (m < .6) { ctx.globalAlpha = (.18 + .5 * si) * (1 - m * 1.4); ctx.fillStyle = "#3be6a0"; ctx.fillText(q.ch, x, y); }
    else if (!q.leaf) { const a = .5 * (1 - rev); if (a > .02) { ctx.globalAlpha = a; ctx.fillStyle = "#7be8b4"; ctx.fillRect(x - 1, y - 1, 2, 2); } }
  }
  // solid, natural-looking tree (normal blending): tapered bark limbs that grow outward level by level
  ctx.globalCompositeOperation = "source-over"; ctx.lineCap = "round";
  if (rev > 0) for (const s of segsT) {
    const p = clamp(raw * (MAXLV + 3) - s[5]); if (p <= 0) continue;
    const x1 = X(s[0]), y1 = Y(s[1]), x2 = x1 + (X(s[2]) - x1) * p, y2 = y1 + (Y(s[3]) - y1) * p, w = Math.max(1.1, s[4] * sc);
    ctx.globalAlpha = 1; ctx.strokeStyle = "#2d3524"; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (w > 3) { ctx.globalAlpha = .55; ctx.strokeStyle = "#5f7a52"; ctx.lineWidth = w * .28; ctx.beginPath(); ctx.moveTo(x1 + w * .18, y1); ctx.lineTo(x2 + w * .18, y2); ctx.stroke(); }
  }
  // canopy depth (soft shadow mass) then individual leaves
  if (lf > 0) for (const c of canopy) { ctx.globalAlpha = .5 * lf; ctx.drawImage(bl, c[0] - c[2] * 1.9, c[1] - c[2] * 1.9, c[2] * 3.8, c[2] * 3.8); }
  for (const q of P) {
    if (!q.leaf || q.m < .55) continue;
    ctx.globalAlpha = .95 * clamp((q.m - .55) / .4); ctx.fillStyle = LEAF[q.ci];
    ctx.beginPath(); ctx.ellipse(q.px, q.py, q.size, q.size * .55, q.ang, 0, 6.283); ctx.fill();
  }
  // gentle energy pulses along limbs/roots
  ctx.globalCompositeOperation = "lighter";
  if (t > 3.6 && !reduce) pulses.forEach(p => {
    const L = plen(p.p); p.s += p.v * dt;
    if (p.s > L + 40) { p.p = paths[(Math.random() * paths.length) | 0]; p.s = -Math.random() * 150; }
    if (p.s > 0) { const q = at(p.p, Math.min(p.s, L)); glow(q[0], q[1], 11, .8); glow(q[0], q[1], 4, 1); }
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
if (reduce) { frame(performance.now() + 100); } else requestAnimationFrame(frame);
if (reduce) { addEventListener("resize", () => frame(performance.now())); }
</script>
</body>
</html>
